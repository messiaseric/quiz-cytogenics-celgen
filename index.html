<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desafio da Terapia Celular</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#3a0a7a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-sized column, one screen at a time, on the CytoGenics purple field;
   white cards carry the content, green is the single action colour. */
:root{
  --purple-900:#22054a; --purple-800:#2f0866; --purple-700:#3a0a7a; --purple-600:#4b0f96; --purple-500:#5f1fb4;
  --green:#7df98e; --green-ink:#0d3b1a; --mint:#a6f9c2;
  --paper:#ffffff; --paper-2:#f4f0fa; --ink:#1d1430; --ink-2:#5b5070; --line:#e3dbef;
  --ok:#139a43; --ok-bg:#e7f8ed; --bad:#c2334d; --bad-bg:#fbe9ed;
  --display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--body);font-size:16px;line-height:1.5;color:#fff;
  background:var(--purple-700);
  background-image:
    radial-gradient(60% 40% at 85% 0%, rgba(125,249,142,.16), transparent 70%),
    radial-gradient(70% 50% at 0% 100%, rgba(95,31,180,.9), transparent 70%),
    linear-gradient(180deg,var(--purple-600),var(--purple-800));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
header.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 14px}
header.brand .cyto{height:30px;width:auto}
header.brand .milt{height:34px;width:auto;background:#fff;border-radius:10px;padding:4px 8px}
.progress{display:flex;gap:6px;margin-bottom:14px}
.progress span{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.18);transition:background .3s}
.progress span.on{background:var(--green)}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;animation:in .35s ease both}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen,.pop{animation:none!important}*{transition:none!important}}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,8.5vw,40px);line-height:1.08;font-weight:800}
h1 em{font-style:normal;color:var(--green)}
h2{font-size:clamp(21px,5.6vw,25px);line-height:1.22;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
.lede{font-size:17px;color:rgba(255,255,255,.86);margin:0}
.card{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:20px;box-shadow:0 18px 40px -18px rgba(10,0,30,.6)}
.hero-art{border-radius:var(--r);background:var(--mint);overflow:hidden;aspect-ratio:900/430;max-width:100%}
.hero-art img{display:block;width:100%;height:100%;object-fit:cover}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.chip-info{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff}
.chip-info b{color:var(--green);font-family:var(--display)}
.btn{appearance:none;border:0;cursor:pointer;font:700 17px/1 var(--body);border-radius:999px;padding:18px 24px;width:100%;
  background:var(--green);color:var(--purple-900);display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 24px -10px rgba(125,249,142,.7);transition:transform .12s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,input:focus-visible,.link:focus-visible,summary:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.spacer{flex:1}
.foot-note{font-size:12.5px;color:rgba(255,255,255,.62);text-align:center;margin:0}
.link{background:none;border:0;color:var(--mint);font:600 14px var(--body);text-decoration:underline;cursor:pointer;padding:6px}

/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:baseline}
.qmeta .n{font-family:var(--display);font-weight:700;color:var(--green)}
.qmeta .score{font-size:14px;color:rgba(255,255,255,.7)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;width:100%;cursor:pointer;font:600 15.5px/1.4 var(--body);color:var(--ink);background:var(--paper);
  border:2px solid transparent;border-radius:18px;padding:15px 16px;display:flex;gap:12px;align-items:flex-start;transition:border-color .2s, background .2s, opacity .2s}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--display);background:var(--paper-2);color:var(--purple-600)}
.opt:hover{border-color:var(--purple-500)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)} .opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
.explain{border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:15px}
.explain strong{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
.explain.ok strong{color:var(--green)} .explain.bad strong{color:#ffb3c1}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.92);opacity:.001}to{transform:none;opacity:1}}

/* gate */
.scorebig{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--green)}
.scorebig small{font-size:28px;color:#fff;opacity:.7}
.teaser{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:1;max-width:260px;width:70%;align-self:center}
.teaser img{width:100%;height:100%;object-fit:cover;filter:blur(18px) saturate(1.2);transform:scale(1.15)}
.teaser .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(34,5,74,.25)}
.teaser .lock span{background:var(--paper);color:var(--purple-700);font:700 14px var(--display);padding:10px 16px;border-radius:999px}

/* forms */
form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.legend{font-weight:700;font-size:15px;color:var(--ink)}
.legend small,.field label small{font-weight:500;color:var(--ink-2)}
input[type=text],input[type=email],input[type=tel]{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--paper-2);border:2px solid transparent;border-radius:14px;padding:14px 14px;color-scheme:light}
input::placeholder{color:#9a90ad}
input:focus{border-color:var(--purple-500);background:#fff;outline:none}
.field.err input{border-color:var(--bad);background:var(--bad-bg)}
.errmsg{font-size:13px;color:var(--bad);font-weight:600;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;cursor:pointer;font:600 14px/1.25 var(--body);color:var(--ink);background:var(--paper-2);border:2px solid transparent;border-radius:999px;padding:9px 14px;text-align:left}
.chip[aria-pressed=true]{background:var(--purple-600);color:#fff}
.chips.err .chip{border-color:rgba(194,51,77,.45)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--ink);cursor:pointer}
.check input{flex:none;width:24px;height:24px;margin:0;accent-color:var(--purple-600)}
.check.err{color:var(--bad)}
details.rules{font-size:14px;color:var(--ink-2);background:var(--paper-2);border-radius:14px;padding:10px 14px}
details.rules summary{cursor:pointer;font-weight:700;color:var(--purple-600)}
details.rules ul{margin:8px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.divider{height:1px;background:var(--line)}
.privacy{font-size:12.5px;color:var(--ink-2);margin:0}

/* result */
.profile{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.profile img{width:min(78%,300px);aspect-ratio:1;object-fit:cover;border-radius:24px;box-shadow:0 20px 40px -20px rgba(10,0,30,.6)}
.profile .tag{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--purple-600)}
.profile h2{color:var(--purple-800)}
.profile p{margin:0;color:var(--ink-2)}
.ticket{background:var(--green);color:var(--purple-900);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ticket h3{font-size:19px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:rgba(34,5,74,.08);border-radius:14px;padding:10px 8px;text-align:center}
.slot b{display:block;font:800 19px var(--display);font-variant-numeric:tabular-nums}
.slot span{font-size:12.5px;font-weight:600}
.ticket p{margin:0;font-size:14px;font-weight:600}
.cal{display:flex;gap:8px;flex-wrap:wrap}
.cal a{flex:1 1 140px;text-decoration:none}
.testbar{position:fixed;left:0;right:0;bottom:0;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#ffd166;color:#3a2a00;font:600 12px var(--body);text-align:center;z-index:5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const live = () => /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(ENDPOINT.trim());
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d }catch(e){ return d } },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} } };

function shuffle(n){ const a=[...Array(n).keys()]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a; }

function brand(){ return `<header class="brand"><img class="cyto" src="${ASSETS.cyto}" alt="CytoGenics"><img class="milt" src="${ASSETS.milt}" alt="Miltenyi Biotec"></header>`; }
function progress(active){ const total=7; return `<div class="progress" aria-hidden="true">${Array.from({length:total},(_,i)=>`<span class="${i<active?"on":""}"></span>`).join("")}</div>`; }

/* ---------- telas ---------- */
function render(){
  const f = { intro, quiz, gate, contato, perfil, result }[S.step];
  app.innerHTML = f();
  bind[S.step] && bind[S.step]();
  window.scrollTo({top:0});
  const h = app.querySelector("h1,h2"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
}

function intro(){ return `${brand()}
<section class="screen">
  <div class="hero-art"><img src="${ASSETS.chars}" alt="Personagens de células da CytoGenics"></div>
  <span class="eyebrow">CEL-GEN 2026 · estande CytoGenics</span>
  <h1>Desafio da <em>Terapia Celular</em></h1>
  <p class="lede">Responda 4 perguntas, descubra seu perfil científico e concorra a uma pelúcia especial.</p>
  <div class="facts"><span class="chip-info"><b>4</b> perguntas</span><span class="chip-info"><b>1</b> minuto</span><span class="chip-info"><b>3</b> sorteios</span></div>
  <div class="spacer"></div>
  <button class="btn" id="go">Começar o desafio</button>
  <p class="foot-note">Uma experiência CytoGenics e Miltenyi Biotec</p>
</section>`; }

function quiz(){
  const q = QUESTIONS[S.q]; const ans = S.answers[q.id];
  if(!S.order[q.id]) S.order[q.id] = shuffle(q.options.length);
  const done = ans !== undefined;
  const opts = S.order[q.id].map((oi,pos)=>{
    let cls = "";
    if(done){ if(oi===q.correct) cls="ok"; else if(oi===ans) cls="bad"; else cls="dim"; }
    return `<button class="opt ${cls}" data-i="${oi}" ${done?"disabled":""}><span class="k">${"ABC"[pos]}</span><span>${esc(q.options[oi])}</span></button>`;
  }).join("");
  const right = done && ans===q.correct;
  return `${brand()}${progress(S.q+1)}
<section class="screen">
  <div class="qmeta"><span class="n">Pergunta ${S.q+1} de 4</span><span class="score">${S.score} ${S.score===1?"acerto":"acertos"}</span></div>
  <h2>${esc(q.text)}</h2>
  <div class="opts" role="group" aria-label="Alternativas">${opts}</div>
  ${done?`<div class="explain pop ${right?"ok":"bad"}"><strong>${right?"Acertou!":"Quase lá!"}</strong>${esc(q.why)}</div>`:""}
  <div class="spacer"></div>
  ${done?`<button class="btn pop" id="next">${S.q<3?"Próxima pergunta":"Ver meu resultado"}</button>`:""}
</section>`; }

function gate(){
  const p = profileFor(S.score);
  return `${brand()}${progress(5)}
<section class="screen">
  <span class="eyebrow">Desafio concluído</span>
  <div class="scorebig">${S.score}<small> de 4</small></div>
  <h2>${S.score===4?"Gabaritou! ":S.score>=2?"Mandou bem! ":""}Seu perfil científico está pronto.</h2>
  <div class="teaser"><img src="${ASSETS[p.img]}" alt=""><div class="lock"><span>🔒 Perfil bloqueado</span></div></div>
  <p class="lede">Cadastre-se em 2 passos rápidos para revelar seu perfil e entrar no sorteio da pelúcia.</p>
  <div class="spacer"></div>
  <button class="btn" id="go">Revelar meu perfil</button>
</section>`; }

function contato(){ const c=S.contato; return `${brand()}${progress(6)}
<section class="screen">
  <span class="eyebrow">Passo 1 de 2 · Contato</span>
  <h2>Como falamos com você se ganhar?</h2>
  <form class="card" id="f" novalidate>
    <div class="field" id="w-nome"><label for="nome">Nome completo</label>
      <input id="nome" type="text" autocomplete="name" autocapitalize="words" value="${esc(c.nome)}" placeholder="Seu nome"><span class="errmsg"></span></div>
    <div class="field" id="w-email"><label for="email">E-mail</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" value="${esc(c.email)}" placeholder="voce@instituicao.br"><span class="errmsg"></span></div>
    <div class="field" id="w-tel"><label for="tel">Celular <small>(WhatsApp)</small></label>
      <input id="tel" type="tel" inputmode="tel" autocomplete="tel-national" value="${esc(c.telefone)}" placeholder="(11) 98765-4321"><span class="errmsg"></span></div>
    <button class="btn" type="submit">Continuar</button>
  </form>
  <p class="foot-note">Seus dados são usados para registrar sua participação e administrar o sorteio, conforme a LGPD.</p>
</section>`; }

function chipGroup(name, items, selected, multi){
  return items.map(v=>`<button type="button" class="chip" data-g="${name}" data-v="${esc(v)}" aria-pressed="${multi?selected.includes(v):selected===v}">${esc(v)}</button>`).join("");
}

function perfil(){ const p=S.perfil; return `${brand()}${progress(7)}
<section class="screen">
  <span class="eyebrow">Passo 2 de 2 · Seu perfil</span>
  <h2>Conte um pouco da sua atuação</h2>
  <form class="card" id="f" novalidate>
    <div class="field" id="w-cargo"><span class="legend" id="l-cargo">Cargo / momento atual</span>
      <div class="chips" role="group" aria-labelledby="l-cargo">${chipGroup("cargo",CARGOS,p.cargo,false)}</div>
      <input id="cargoOutro" type="text" placeholder="Qual o seu cargo?" value="${esc(p.cargoOutro)}" ${p.cargo==="Outro"?"":"hidden"}><span class="errmsg"></span></div>
    <div class="field" id="w-form"><span class="legend" id="l-form">Área de formação</span>
      <div class="chips" role="group" aria-labelledby="l-form">${chipGroup("formacao",FORMACOES,p.formacao,false)}</div>
      <input id="formacaoOutro" type="text" placeholder="Qual a sua formação?" value="${esc(p.formacaoOutro)}" ${p.formacao==="Outro"?"":"hidden"}><span class="errmsg"></span></div>
    <div class="field" id="w-inst"><label for="inst">Instituição ou empresa</label>
      <input id="inst" type="text" autocomplete="organization" value="${esc(p.instituicao)}" placeholder="Ex.: USP, Hospital Albert Einstein…"><span class="errmsg"></span></div>
    <div class="field" id="w-int"><span class="legend" id="l-int">O que faz parte da sua pesquisa ou desperta seu interesse? <small>Marque quantos quiser</small></span>
      <div class="chips" role="group" aria-labelledby="l-int">${chipGroup("interesses",INTERESSES,p.interesses,true)}</div>
      <input id="intOutro" type="text" placeholder="Qual outra área?" value="${esc(p.interessesOutro)}" ${p.interesses.includes("Outro")?"":"hidden"}><span class="errmsg"></span></div>
    <div class="divider"></div>
    <details class="rules" open><summary>Regras do sorteio</summary><ul>
      <li>Uma inscrição por pessoa, válida para os três sorteios (03, 04 e 05/11).</li>
      <li>Sorteios no estande da CytoGenics: 03/11 às 16h15, 04/11 às 16h30 e 05/11 às 10h45.</li>
      <li>Para ganhar, é preciso estar no estande na hora do sorteio. Se a pessoa sorteada não estiver presente, sorteamos de novo.</li>
    </ul></details>
    <label class="check" id="w-regras"><input type="checkbox" id="regras" ${p.regras?"checked":""}><span>Li e aceito as regras do sorteio e o uso dos meus dados para registrar minha participação.</span></label>
    <label class="check"><input type="checkbox" id="mkt" ${p.marketing?"checked":""}><span>Quero receber e-mails da CytoGenics com conteúdos científicos, novidades e convites para eventos. <small style="color:var(--ink-2)">(opcional)</small></span></label>
    <p class="privacy">A CytoGenics trata seus dados conforme a Lei Geral de Proteção de Dados (LGPD). O envio de comunicações só acontece se você marcar a opção acima.</p>
    <div class="sr" aria-hidden="true"><label for="website">Deixe em branco</label><input id="website" type="text" tabindex="-1" autocomplete="off"></div>
    <button class="btn" type="submit" id="send">Revelar meu perfil</button>
  </form>
</section>`; }

function result(){ const p=profileFor(S.score); const first=(S.contato.nome.trim().split(/\s+/)[0]||"");
  return `${brand()}
<section class="screen">
  <div class="card profile pop">
    <span class="tag">${first?esc(first)+", seu":"Seu"} perfil científico</span>
    <img src="${ASSETS[p.img]}" alt="Ilustração do perfil ${esc(p.name)}">
    <h2>${esc(p.name)}</h2>
    <p>${S.score} de 4 acertos. ${esc(p.text)}</p>
  </div>
  <div class="ticket">
    <h3>${S.duplicate?"✅ Você já estava inscrito(a), sua inscrição continua valendo!":"✅ Você está no sorteio!"}</h3>
    <div class="slots">${DRAWS.map(d=>`<div class="slot"><b>${d.time}</b><span>${d.label}</span></div>`).join("")}</div>
    <p>Esteja no estande da CytoGenics na hora do sorteio para levar a pelúcia.</p>
  </div>
  <div class="cal">${DRAWS.map(d=>`<a class="btn ghost" target="_blank" rel="noopener" href="${gcal(d)}">Lembrete ${d.label}</a>`).join("")}</div>
  <p class="foot-note">Aproveite o CEL-GEN 2026!</p>
  <button class="link" id="again">Novo participante</button>
</section>`; }

function gcal(d){
  const q=new URLSearchParams({action:"TEMPLATE",text:"Sorteio da pelúcia CytoGenics · CEL-GEN 2026",dates:`${d.start}/${d.end}`,ctz:"America/Sao_Paulo",
    details:"Esteja no estande da CytoGenics na hora do sorteio para levar a pelúcia.",location:"Estande CytoGenics · CEL-GEN 2026"});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}

function profileFor(n){ return PROFILES.find(p=>n>=p.min&&n<=p.max); }

/* ---------- interações ---------- */
const bind = {
  intro(){ app.querySelector("#go").onclick=()=>{ S.step="quiz"; S.q=0; render(); }; },
  quiz(){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const q=QUESTIONS[S.q]; if(S.answers[q.id]!==undefined) return;
      const i=+b.dataset.i; S.answers[q.id]=i; if(i===q.correct) S.score++;
      if(navigator.vibrate) try{ navigator.vibrate(i===q.correct?30:[20,40,20]) }catch(e){}
      render();
    });
    const n=app.querySelector("#next"); if(n) n.onclick=()=>{ if(S.q<3){ S.q++; } else { S.step="gate"; } render(); };
  },
  gate(){ app.querySelector("#go").onclick=()=>{ S.step="contato"; render(); }; },
  contato(){
    const tel=app.querySelector("#tel");
    tel.addEventListener("input",()=>{ tel.value=maskPhone(tel.value); });
    app.querySelector("#f").addEventListener("submit",e=>{
      e.preventDefault();
      const c={ nome:val("#nome"), email:val("#email").toLowerCase(), telefone:val("#tel") };
      let ok=true;
      ok&=check("#w-nome", c.nome.split(/\s+/).filter(Boolean).length>=2, "Informe nome e sobrenome.");
      ok&=check("#w-email", /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email), "Confira o e-mail, ele parece incompleto.");
      const d=c.telefone.replace(/\D/g,"");
      ok&=check("#w-tel", d.length>=10&&d.length<=13, "Informe o celular com DDD.");
      S.contato=c;
      if(ok){ S.step="perfil"; render(); } else focusFirstErr();
    });
  },
  perfil(){
    const f=app.querySelector("#f");
    f.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
      const g=b.dataset.g, v=b.dataset.v, p=S.perfil;
      if(g==="interesses"){ const i=p.interesses.indexOf(v); i>=0?p.interesses.splice(i,1):p.interesses.push(v); b.setAttribute("aria-pressed",p.interesses.includes(v)); toggle("#intOutro",p.interesses.includes("Outro")); }
      else { p[g]=v; f.querySelectorAll(`.chip[data-g="${g}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b)); toggle(g==="cargo"?"#cargoOutro":"#formacaoOutro", v==="Outro"); }
      b.closest(".field").classList.remove("err"); b.closest(".chips").classList.remove("err"); b.closest(".field").querySelector(".errmsg").textContent="";
    });
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const p=S.perfil;
      p.cargoOutro=val("#cargoOutro"); p.formacaoOutro=val("#formacaoOutro"); p.instituicao=val("#inst"); p.interessesOutro=val("#intOutro");
      p.regras=f.querySelector("#regras").checked; p.marketing=f.querySelector("#mkt").checked;
      let ok=true;
      ok&=check("#w-cargo", p.cargo && (p.cargo!=="Outro"||p.cargoOutro), "Escolha uma opção.", true);
      ok&=check("#w-form", p.formacao && (p.formacao!=="Outro"||p.formacaoOutro), "Escolha sua formação.", true);
      ok&=check("#w-inst", p.instituicao.length>=2, "Informe sua instituição ou empresa.");
      ok&=check("#w-int", p.interesses.length>0 && (!p.interesses.includes("Outro")||p.interessesOutro), "Marque pelo menos uma área.", true);
      const r=f.querySelector("#w-regras"); r.classList.toggle("err",!p.regras); ok&=p.regras;
      if(!ok){ focusFirstErr(); return; }
      const btn=f.querySelector("#send"); btn.disabled=true; btn.textContent="Enviando…";
      await submit(buildPayload());
      S.step="result"; render();
    });
  },
  result(){ app.querySelector("#again").onclick=reset; }
};

function val(sel){ const el=app.querySelector(sel); return el?el.value.trim():""; }
function toggle(sel,show){ const el=app.querySelector(sel); if(el){ el.hidden=!show; if(show) el.focus(); } }
function check(wrap, cond, msg, chips){ const w=app.querySelector(wrap); w.classList.toggle("err",!cond); if(chips) w.querySelector(".chips").classList.toggle("err",!cond); w.querySelector(".errmsg").textContent=cond?"":msg; return !!cond; }
function focusFirstErr(){ const e=app.querySelector(".err"); if(e){ e.scrollIntoView({behavior:"smooth",block:"center"}); const i=e.querySelector("input:not([hidden]),button"); i&&i.focus({preventScroll:true}); } }
function maskPhone(v){ const d=v.replace(/\D/g,"").slice(0,11); if(d.length<=2) return d?`(${d}`:""; if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`; if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; }
function reset(){ Object.assign(S,{ step:"intro", q:0, answers:{}, order:{}, score:0, contato:{nome:"",email:"",telefone:""},
  perfil:{cargo:"",cargoOutro:"",formacao:"",formacaoOutro:"",instituicao:"",interesses:[],interessesOutro:"",regras:false,marketing:false} }); render(); }

/* ---------- envio para a planilha (com fila offline) ---------- */
function newId(){ try{ return crypto.randomUUID(); }catch(e){ return Date.now().toString(36)+Math.random().toString(36).slice(2); } }
function buildPayload(){
  const p=S.perfil, ints=p.interesses.filter(i=>i!=="Outro");
  if(p.interesses.includes("Outro")&&p.interessesOutro) ints.push("Outro: "+p.interessesOutro);
  const respostas={}; QUESTIONS.forEach(q=>{ respostas[q.id]=(S.answers[q.id]===q.correct?"Certa · ":"Errada · ")+q.options[S.answers[q.id]].slice(0,120); });
  return {
    id:newId(), website:(app.querySelector("#website")||{}).value||"",
    nome:S.contato.nome, email:S.contato.email, telefone:S.contato.telefone,
    instituicao:p.instituicao,
    formacao:p.formacao==="Outro"?(p.formacaoOutro||"Outro"):p.formacao,
    cargo:p.cargo==="Outro"?(p.cargoOutro||"Outro"):p.cargo,
    interesses:ints, pontuacao:S.score, perfil:profileFor(S.score).name,
    marketing:p.marketing, regras:p.regras===true, respostas
  };
}

// Envia uma inscrição. Resolve com a resposta do script; rejeita se não houve conexão.
async function post(item){
  const r=await fetch(ENDPOINT.trim(),{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(item), redirect:"follow" });
  let data=null; try{ data=await r.json(); }catch(e){}
  if(!r.ok || !data || (data.ok===false && data.error==="server")) throw new Error("falha no envio");
  return data;
}
function enqueue(item){ const q=store.get("cg_queue",[]); if(!q.some(x=>x.id===item.id)) q.push(item); store.set("cg_queue",q); }

async function submit(item){
  S.duplicate=false;
  if(!live()){ const t=store.get("cg_test",[]); t.push(item); store.set("cg_test",t); console.info("[modo de teste] inscrição montada:",item); await new Promise(r=>setTimeout(r,500)); return; }
  try{
    const res=await Promise.race([ post(item), new Promise((_,rej)=>setTimeout(()=>rej(new Error("tempo esgotado")),12000)) ]);
    S.duplicate=!!res.duplicate;
  }catch(e){ enqueue(item); }
}

let flushing=false;
async function flush(){
  if(!live()||flushing) return;
  const q=store.get("cg_queue",[]); if(!q.length) return;
  flushing=true; const rest=[];
  for(const it of q){ try{ await post(it); }catch(e){ rest.push(it); } }
  store.set("cg_queue",rest); flushing=false;
}
window.addEventListener("online",flush);
setInterval(flush,30000);

document.getElementById("testbar").hidden = live();
render(); flush();
</script>
